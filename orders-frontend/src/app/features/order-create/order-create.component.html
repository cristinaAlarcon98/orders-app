<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h1 class="h3 mb-4">Nuevo pedido</h1>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Cliente</label>
          <input
            type="text"
            class="form-control"
            formControlName="customerName"
            [class.is-invalid]="form.get('customerName')?.invalid && form.get('customerName')?.touched"
          />
          <div class="invalid-feedback">El nombre del cliente es obligatorio</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Producto</label>
          <input
            type="text"
            class="form-control"
            formControlName="product"
            [class.is-invalid]="form.get('product')?.invalid && form.get('product')?.touched"
          />
          <div class="invalid-feedback">El producto es obligatorio</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Cantidad</label>
          <input
            type="number"
            class="form-control"
            formControlName="quantity"
            [class.is-invalid]="form.get('quantity')?.invalid && form.get('quantity')?.touched"
          />
          <div class="invalid-feedback">La cantidad debe ser mayor que 0</div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Crear pedido</button>
          <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
